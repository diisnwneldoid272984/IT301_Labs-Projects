<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux Distro Guide - Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- contact page with the question form -->
  <header>
    <h1>Linux Distro Guide</h1>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="ubuntu.html">Ubuntu</a></li>
      <li><a href="fedora.html">Fedora</a></li>
      <li><a href="arch.html">Arch</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>
  <main>
    <h2>Ask a question</h2>
    <p>Not sure which distro to pick? Send a question.</p>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="distro">Distro you are looking at</label>
      <select id="distro" name="distro" required>
        <option value="">Choose one</option>
        <option value="ubuntu">Ubuntu</option>
        <option value="fedora">Fedora</option>
        <option value="arch">Arch</option>
      </select>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
  <footer>
    <p>Linux Distro Guide - IT 301 Project</p>
  </footer>
</body>
</html>
