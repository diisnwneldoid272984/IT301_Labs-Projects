<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
    let posts = [];

    function showPost(post) {
        let article = document.createElement('article');

        let h2 = document.createElement('h2');
        h2.textContent = post.title;

        let ids = document.createElement('p');
        ids.textContent = `User ID: ${post.userId} | Post ID: ${post.id}`;

        let body = document.createElement('p');
        body.textContent = post.body;

        article.append(h2, ids, body);
        document.body.append(article);
    }

    async function getPosts() {
        let response = await fetch('https://jsonplaceholder.typicode.com/posts');
        posts = await response.json();
        console.table(posts);

        for (let post of posts) {
            showPost(post);
        }
    }

    getPosts();

    document.getElementById('filterBtn').addEventListener('click', function() {
        let userId = document.getElementById('userID').value;
        console.log(userId);
    });
    </script>

</body>
</html>
