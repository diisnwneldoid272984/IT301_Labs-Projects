<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Database</title>
</head>
<body>
<h1>Student Database</h1>

<label for="name">Name:</label>
<input type="text" id="name"><br><br>

<label for="grade">Grade:</label>
<input type="text" id="grade"><br><br>

<button type="button" id="push">Push Data</button>
<button type="button" id="get">Get Data</button>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD8foW5igNI6zKrhz_vDQbVfxxc-Hvg8KI",
  authDomain: "studentdatabase-49a77.firebaseapp.com",
  projectId: "studentdatabase-49a77",
  storageBucket: "studentdatabase-49a77.firebasestorage.app",
  messagingSenderId: "684592323862",
  appId: "1:684592323862:web:53d8a0bd1d2d9d1a170437"
};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


const nameInput = document.getElementById('name');
const gradeInput = document.getElementById('grade');
const pushBtn = document.getElementById('push');
const getBtn = document.getElementById('get');

pushBtn.addEventListener('click', async function(event) {

    try {

        const docRef = await db.collection('students').add({
            name: nameInput.value,
            grade: gradeInput.value, 
            pass: gradeInput.value > 50 ? 'pass' : 'fail'
        });

        alert('Your data saved successfully');

    } catch (error) {

        console.error("Firebase error:", error);
        alert("Could not save your data.");

    }

});
getBtn.addEventListener('click', async function(event) {

    try {

        const snapshot = await db.collection('students').get();

        snapshot.forEach(doc => {

            console.log(`Name: ${doc.data().name}
Grade: ${doc.data().grade}
Pass: ${doc.data().pass}`);

        });

    } catch (error) {

        console.error("Firebase error:", error);
        alert("Could not retrieve your data.");

    }

});
</script>
</body>
</html>
